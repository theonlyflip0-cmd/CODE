<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Options — Locked In</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #050505; color: #F0EDE8; font-family: 'Barlow', sans-serif; overflow-x: hidden; }

#picker {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(5,5,5,0.94); backdrop-filter: blur(12px);
  border-bottom: 1px solid #1e1e1e; padding: 12px 0;
}
.picker-inner {
  max-width: 900px; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.picker-label {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;
  color: #C8102E; margin-right: 4px; white-space: nowrap;
}
.option-btn {
  background: #111; border: 1px solid #2a2a2a; color: #aaa;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 8px 18px; border-radius: 2px; cursor: pointer;
  transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
}
.option-btn:hover { border-color: #555; color: #fff; }
.option-btn.active { border-color: #C8102E; color: #fff; background: rgba(200,16,46,0.12); }

.bg-canvas { display: none; position: fixed; inset: 0; z-index: 0; }
.bg-canvas.active { display: block; }

.demo-content {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  padding: 120px clamp(24px, 8vw, 140px) 80px;
  pointer-events: none;
}
.demo-eyebrow {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
  color: #C8102E; margin-bottom: 20px;
}
.demo-headline {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: clamp(56px, 10vw, 110px); line-height: 0.88;
  text-transform: uppercase; letter-spacing: -0.01em;
  margin-bottom: 28px;
}
.demo-headline em { font-style: normal; color: #C8102E; display: block; }
.demo-sub {
  font-size: clamp(15px, 1.8vw, 18px); color: #999;
  max-width: 440px; line-height: 1.65; margin-bottom: 40px;
}
.demo-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: #C8102E; color: #fff;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 18px 40px; border-radius: 2px; pointer-events: all;
  transition: background 200ms ease, transform 100ms cubic-bezier(0.23,1,0.32,1);
}
.demo-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="picker">
  <div class="picker-inner">
    <span class="picker-label">Pick →</span>
    <button class="option-btn active" data-bg="embers">A · Embers</button>
    <button class="option-btn" data-bg="shards">B · Shards</button>
    <button class="option-btn" data-bg="impact">C · Impact</button>
  </div>
</div>

<canvas id="canvas-embers" class="bg-canvas active"></canvas>
<canvas id="canvas-shards" class="bg-canvas"></canvas>
<canvas id="canvas-impact" class="bg-canvas"></canvas>

<div class="demo-content">
  <p class="demo-eyebrow">1:1 Fight Performance Coaching</p>
  <h1 class="demo-headline">Stop<br>Gassing<br><em>Out.</em></h1>
  <p class="demo-sub">I build competition-level gas tanks for combat athletes — personalised strength, nutrition, and conditioning.</p>
  <a href="#" class="demo-btn">Book Your Free Call →</a>
</div>

<script>
const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
const vel = { x: 0, y: 0 };
let lastX = mouse.x, lastY = mouse.y;

document.addEventListener('mousemove', e => {
  vel.x = e.clientX - lastX;
  vel.y = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  mouse.x = e.clientX; mouse.y = e.clientY;
});

// ── A: EMBERS ───────────────────────────────────────────────────
// Burning coal embers rising from the dark — cursor blasts them sideways
(function embers() {
  const canvas = document.getElementById('canvas-embers');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const COUNT = 220;
  const particles = [];

  function spawn() {
    const x = Math.random() * canvas.width;
    return {
      x,
      y: canvas.height + Math.random() * 40,
      vx: (Math.random() - 0.5) * 0.8,
      vy: -(Math.random() * 1.8 + 0.6),
      life: 1,
      decay: Math.random() * 0.004 + 0.002,
      size: Math.random() * 2.5 + 0.8,
      bright: Math.random(),
    };
  }

  for (let i = 0; i < COUNT; i++) {
    const p = spawn();
    p.y = Math.random() * canvas.height; // scatter initial state
    p.life = Math.random();
    particles.push(p);
  }

  function draw() {
    ctx.fillStyle = 'rgba(4,2,2,0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);

    particles.forEach((p, i) => {
      // cursor shockwave — repel violently based on mouse speed
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const radius = 140 + speed * 3;
      if (dist < radius && dist > 0) {
        const force = (1 - dist / radius) * (0.6 + speed * 0.08);
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }

      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.97;
      p.vy -= 0.015; // gravity upward (float)
      p.vx += (Math.random() - 0.5) * 0.08; // flicker
      p.life -= p.decay;

      if (p.life <= 0 || p.y < -20) {
        Object.assign(particles[i], spawn());
        return;
      }

      const alpha = p.life;
      const heat = p.bright;
      // color: white core → orange → deep red → gone
      let r, g, b;
      if (heat > 0.75) { r=255; g=220; b=180; } // white-hot
      else if (heat > 0.4) { r=255; g=80; b=20; } // orange
      else { r=180; g=16; b=16; } // deep red

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.9})`;
      ctx.fill();

      // glow
      if (alpha > 0.5) {
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 5);
        glow.addColorStop(0, `rgba(${r},${g},${b},${alpha * 0.25})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 5, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
      }
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

// ── B: SHARDS ───────────────────────────────────────────────────
// Shattered glass / metal shards floating in dark — cursor scatters them
(function shards() {
  const canvas = document.getElementById('canvas-shards');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const COUNT = 80;
  const shards = [];

  function makeShard() {
    const angle = Math.random() * Math.PI * 2;
    const size = Math.random() * 28 + 8;
    const sides = Math.floor(Math.random() * 3) + 3; // 3–5 sided
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      rotation: angle,
      rotSpeed: (Math.random() - 0.5) * 0.008,
      size,
      sides,
      alpha: Math.random() * 0.3 + 0.05,
      red: Math.random() < 0.25,
    };
  }

  for (let i = 0; i < COUNT; i++) shards.push(makeShard());

  function drawShard(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rotation);
    ctx.beginPath();
    // irregular polygon
    for (let i = 0; i < s.sides; i++) {
      const a = (i / s.sides) * Math.PI * 2 - Math.PI / 2;
      const r = s.size * (0.6 + Math.random() * 0.4);
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();

    if (s.red) {
      ctx.strokeStyle = `rgba(200,16,46,${s.alpha * 2.5})`;
      ctx.fillStyle = `rgba(200,16,46,${s.alpha * 0.15})`;
    } else {
      ctx.strokeStyle = `rgba(240,237,232,${s.alpha * 1.2})`;
      ctx.fillStyle = `rgba(240,237,232,${s.alpha * 0.06})`;
    }
    ctx.lineWidth = 0.8;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = 'rgba(4,3,3,0.22)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);

    shards.forEach(s => {
      const dx = s.x - mouse.x, dy = s.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const radius = 180 + speed * 4;

      if (dist < radius && dist > 0) {
        const force = (1 - dist / radius) * (0.8 + speed * 0.1);
        s.vx += (dx / dist) * force * 1.2;
        s.vy += (dy / dist) * force * 1.2;
        s.rotSpeed += force * 0.02 * (Math.random() > 0.5 ? 1 : -1);
        s.alpha = Math.min(0.55, s.alpha + force * 0.08);
      }

      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.96; s.vy *= 0.96;
      s.rotSpeed *= 0.98;
      s.rotation += s.rotSpeed;
      s.alpha = Math.max(s.red ? 0.08 : 0.04, s.alpha * 0.995);

      // wrap
      const pad = s.size * 2;
      if (s.x < -pad) s.x = canvas.width + pad;
      if (s.x > canvas.width + pad) s.x = -pad;
      if (s.y < -pad) s.y = canvas.height + pad;
      if (s.y > canvas.height + pad) s.y = -pad;

      drawShard(s);
    });

    // cursor crosshair
    ctx.strokeStyle = 'rgba(200,16,46,0.5)';
    ctx.lineWidth = 1;
    const cr = 12 + speed * 0.5;
    ctx.beginPath();
    ctx.moveTo(mouse.x - cr, mouse.y); ctx.lineTo(mouse.x + cr, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - cr); ctx.lineTo(mouse.x, mouse.y + cr);
    ctx.stroke();

    requestAnimationFrame(draw);
  }
  draw();
})();

// ── C: IMPACT ───────────────────────────────────────────────────
// Dense field of red dust/grit — cursor hits like a punch, sending shockwaves
(function impact() {
  const canvas = document.getElementById('canvas-impact');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const COUNT = 500;
  const dots = [];

  function makeDot() {
    return {
      ox: Math.random() * canvas.width, // origin x
      oy: Math.random() * canvas.height, // origin y
      x: 0, y: 0, // will be set below
      vx: 0, vy: 0,
      size: Math.random() * 1.8 + 0.3,
      red: Math.random() < 0.35,
    };
  }

  for (let i = 0; i < COUNT; i++) {
    const d = makeDot();
    d.x = d.ox; d.y = d.oy;
    dots.push(d);
  }

  // Shockwave rings
  const rings = [];
  let lastClickTime = 0;
  canvas.addEventListener('click', e => {
    rings.push({ x: e.clientX, y: e.clientY, r: 0, alpha: 0.8 });
  });

  function draw() {
    ctx.fillStyle = 'rgba(4,2,2,0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);

    dots.forEach(d => {
      const dx = d.x - mouse.x, dy = d.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const radius = 120 + speed * 5;

      if (dist < radius && dist > 0) {
        const force = (1 - dist / radius) * (1.5 + speed * 0.2);
        d.vx += (dx / dist) * force;
        d.vy += (dy / dist) * force;
      }

      // spring back to origin
      d.vx += (d.ox - d.x) * 0.04;
      d.vy += (d.oy - d.y) * 0.04;
      d.vx *= 0.88;
      d.vy *= 0.88;
      d.x += d.vx;
      d.y += d.vy;

      const displaced = Math.sqrt((d.x-d.ox)**2 + (d.y-d.oy)**2);
      const brightness = Math.min(1, displaced / 30);

      let fillColor;
      if (d.red) {
        fillColor = `rgba(200,16,46,${0.4 + brightness * 0.6})`;
      } else {
        fillColor = `rgba(${120 + brightness*80},${80 + brightness*60},${70 + brightness*50},${0.25 + brightness * 0.5})`;
      }

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.size + displaced * 0.04, 0, Math.PI * 2);
      ctx.fillStyle = fillColor;
      ctx.fill();
    });

    // Shockwave rings from clicks
    for (let i = rings.length - 1; i >= 0; i--) {
      const ring = rings[i];
      ring.r += 8;
      ring.alpha -= 0.02;
      if (ring.alpha <= 0) { rings.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,16,46,${ring.alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // cursor ring
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 8 + speed * 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200,16,46,${Math.min(1, 0.4 + speed * 0.05)})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    requestAnimationFrame(draw);
  }
  draw();
})();

// ── SWITCHER ─────────────────────────────────────────────────────
document.querySelectorAll('.option-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.bg-canvas').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('canvas-' + btn.dataset.bg).classList.add('active');
  });
});
</script>
</body>
</html>
